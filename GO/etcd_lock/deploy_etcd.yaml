apiVersion: v1
kind: Pod
metadata:
  name: etcd-dev
  labels:
    app: etcd-dev
spec:
  containers:
  - name: etcd
    image: quay.io/coreos/etcd:v3.5.0
    command: ["/usr/local/bin/etcd"]
    args:
    - "--advertise-client-urls"
    - "http://0.0.0.0:2379"
    - "--listen-client-urls"
    - "http://0.0.0.0:2379"
    ports:
    - containerPort: 2379
      name: client
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-dev
spec:
  selector:
    app: etcd-dev
  ports:
  - port: 2379
    targetPort: 2379
