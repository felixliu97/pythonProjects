# ASX Analysis Suite Global Settings

api:
  announcements_base: "https://asx.api.markitdigital.com/asx-research/1.0/markets/announcements"
  company_header: "https://asx.api.markitdigital.com/asx-research/1.0/companies/{}/header"
  pdf_cdn: "https://cdn-api.markitdigital.com/apiman-gateway/ASX/asx-research/1.0/file/"
  # Manual update required if expired
  pdf_token: "83ff96335c2d45a094df02a206a39ff4"

scanners:
  lookback_months: 2
  items_per_page: 100
  pdf_cache_dir: ".pdf_cache"
  output_dir: "output"

concurrency:
  announcement_pdf_workers: 12
  analyzer_workers: 16
  placements_workers: 20

http:
  analyzer_connect_timeout_seconds: 8
  analyzer_read_timeout_seconds: 15
  pdf_connect_timeout_seconds: 10
  pdf_read_timeout_seconds: 20
  pdf_chunk_size_bytes: 65536
  pdf_max_elapsed_seconds: 15
  pdf_disable_retries: true

announcement_rating:
  price_sensitive_bonus: 1
  strong_phrase_bonus: 3
  high_keyword_bonus: 2
  mid_keyword_bonus: 1
  progress_cap: 4
  all_caps_force_5: true
  all_caps_min_alpha: 10
  noise_keywords:
    - "appendix 4g"
    - "appendix 3y"
    - "change of director"
    - "becoming a substantial holder"
    - "ceasing to be"
    - "notice of meeting"
    - "proxy form"
    - "disclosure notice"
    - "shareholder letter"
    - "investor presentation"
    - "pause in trading"
    - "trading halt"
    - "response to asx price query"
    - "response to price query"
    - "response to price & volume query"
    - "response to price and volume query"
    - "asx price query"
    - "reinstatement to official quotation"
    - "suspension from official quotation"
  strong_catalyst_phrases:
    - "high-grade assay results"
    - "maiden resource estimate"
    - "maiden mre"
    - "resource estimate"
    - "definitive feasibility study"
    - "dfs results"
    - "binding agreement"
    - "binding offtake"
    - "fda approval"
    - "trial results"
    - "phase 3 results"
    - "massive sulphides"
    - "significant discovery"
    - "exceptional intercepts"
    - "high-grade discovery"
    - "conditional spa"
  high_value_keywords:
    - "assay"
    - "drilling"
    - "high-grade"
    - "discovery"
    - "maiden"
    - "resource"
    - "phase 3"
    - "fda"
    - "approval"
    - "exceptional"
    - "breakthrough"
    - "acquisition"
    - "merger"
    - "takeover"
    - "binding"
    - "offtake"
    - "definitive"
    - "feasibility study"
    - "term sheet"
    - "sale and purchase"
    - "monetis"
    - "partnership"
    - "commerciali"
    - "fast-track"
    - "fast track"
    - "commissioning"
    - "first production"
  mid_value_keywords:
    - "trading halt"
    - "placement"
    - "capital rais"
    - "share purchase plan"
    - "quarterly"
    - "half year"
    - "annual report"
    - "guidance"
    - "production"
    - "revenue"
    - "contract"
    - "agreement"
    - "joint venture"
    - "feasibility"
    - "scoping"
    - "update"
    - "progress"
    - "operational"
    - "upgrade"
    - "milestone"
    - "collaboration"
    - "divest"
    - "invest"
    - "strategic"
    - "joint venture"
    - "restructur"

placements:
  keywords:
    - "placement"
    - "capital rais"
    - "capital raise"
    - "share purchase plan"
    - "spp"
    - "equity raising"
    - "entitlement offer"
    - "rights issue"
  headline_patterns:
    - "\\braise(?:s|d)?\\s+a\\$\\s*\\d"
    - "\\bto\\s+fund\\b"
    - "\\bfirm\\s+commitments\\b"
    - "\\bcommitments\\s+received\\b"

