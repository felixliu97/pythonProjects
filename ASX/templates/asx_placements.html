<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans, "Helvetica Neue", Helvetica, Arial, sans-serif);
      font-size: 13px;
    }

    .wrap {
      padding: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    .legend-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #666;
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .radar-table {
      width: 100%;
      border-collapse: collapse;
    }

    .radar-table th {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      background-color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px;
      border-bottom: 1px solid #cbd5e1;
      text-align: left;
      white-space: nowrap;
    }

    .radar-table td {
      padding: 5px 8px;
      border-bottom: 0.5px solid #ddd;
      vertical-align: top;
    }

    .radar-table tr:last-child td {
      border-bottom: none;
    }

    .radar-table tr:nth-child(even) td {
      background-color: #f8f9fa;
    }

    .radar-table th[onclick]:hover {
      background: #f1f5f9;
    }

    .radar-table th.sort-asc::after {
      content: " ▲";
      font-size: 8px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .radar-table th.sort-desc::after {
      content: " ▼";
      font-size: 8px;
      margin-left: 4px;
      vertical-align: middle;
    }

    .radar-table tr:hover td {
      background-color: #f1f3f5;
    }

    .ticker {
      font-weight: 500;
      font-size: 13px;
      color: #333;
    }

    .company-name {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
      line-height: 1.2;
      word-break: break-word;
    }

    .event-pill {
      display: block;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      white-space: normal;
      line-height: 1.3;
      word-break: break-word;
    }

    .e-result {
      background: #E6F1FB;
      color: #0C447C;
    }

    .e-milestone {
      background: #FAEEDA;
      color: #633806;
    }

    .e-production {
      background: #EAF3DE;
      color: #27500A;
    }

    .e-cr {
      background: #FBEAF0;
      color: #72243E;
    }

    .e-risk {
      background: #FCEBEB;
      color: #791F1F;
    }

    .e-corporate {
      background: #EEEDFE;
      color: #3C3489;
    }

    .note-text {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      min-width: 120px;
      white-space: normal;
      word-break: break-word;
    }

    .tbl-wrap {
      background: #fff;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
    }

    .date-tag {
      font-size: 10px;
      font-weight: 500;
      color: #444;
      background: #e0e0e0;
      border-radius: 3px;
      padding: 1px 6px;
      display: inline-block;
      white-space: nowrap;
    }

    .date-recent {
      background: #EF9F27;
      color: #412402;
    }

    .date-today {
      background: #1D9E75;
      color: #04342C;
    }

    .pdf-link {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #E6F1FB;
      color: #0C447C;
      text-decoration: none;
      white-space: nowrap;
    }

    .pdf-link:hover {
      background: #c8def5;
    }

    .cr-val {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .cr-desc {
      font-size: 10px;
      color: #666;
      line-height: 1.3;
      margin-top: 4px;
      white-space: normal;
      word-break: break-word;
    }
    
    .price-up { background: #E1F5EE; color: #085041; }
    .price-down { background: #FCEBEB; color: #791F1F; }
    .price-flat { background: #f1f5f9; color: #475569; }
    .price-na { background: #f1f5f9; color: #999; }

    .diff-val {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .stat-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 500;
    }
  </style>
  <script>
    function sortTable(n, tableId) {
      var table, rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
      table = document.getElementById(tableId);
      switching = true; dir = "asc"; 
      
      function parseCol(str) {
        if (!str || str === "-" || str === "N/A") return -999999;
        var clean = str.replace(/[$,%+]/g, "").trim();
        // Check if looks like a date (YYYY-MM-DD)
        if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(clean)) return -999999;
        var val = parseFloat(clean);
        if (isNaN(val)) return -999999;
        return val;
      }

      while (switching) {
        switching = false; rows = table.rows;
        for (i = 1; i < (rows.length - 1); i++) {
          shouldSwitch = false;
          x = rows[i].getElementsByTagName("TD")[n];
          y = rows[i + 1].getElementsByTagName("TD")[n];
          
          var xContent = x.textContent.trim();
          var yContent = y.textContent.trim();
          
          var xVal = parseCol(xContent);
          var yVal = parseCol(yContent);
          
          var isNumX = xVal !== -999999;
          var isNumY = yVal !== -999999;
          
          if (isNumX && isNumY) {
            if (dir == "asc") { if (xVal > yVal) { shouldSwitch = true; break; } }
            else { if (xVal < yVal) { shouldSwitch = true; break; } }
          } else {
            // String comparison (works for dates too)
            if (dir == "asc") { if (xContent.toLowerCase() > yContent.toLowerCase()) { shouldSwitch = true; break; } }
            else { if (xContent.toLowerCase() < yContent.toLowerCase()) { shouldSwitch = true; break; } }
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true; switchcount ++; 
        } else {
          if (switchcount == 0 && dir == "asc") { dir = "desc"; switching = true; }
        }
      }

      // Final visual indicators
      var headers = table.getElementsByTagName("TH");
      for (var h = 0; h < headers.length; h++) {
        headers[h].classList.remove("sort-asc", "sort-desc");
      }
      if (dir == "asc") { headers[n].classList.add("sort-asc"); }
      else { headers[n].classList.add("sort-desc"); }
    }
  </script>
</head>

<body>

  <div class="wrap">
    <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 16px; color: #1e293b;">ASX Capital Placements <span style="font-size: 16px; font-weight: 400; color: #64748b;">Scanner</span></h1>

    <div class="legend-row">
      <div class="leg">
        <div class="leg-dot" style="background:#085041;"></div>溢价 (Premium)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#791F1F;"></div>折价 (Discount)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#999;"></div>无数据 (N/A)
      </div>
      <span style="margin-left:auto; font-size:11px; color:#999;">{{ stats_text }}</span>
    </div>

    <div class="tbl-wrap">
      <table id="placementsTable" class="radar-table">
        <thead>
          <tr>
            <th onclick="sortTable(0, 'placementsTable')" style="width:6%; min-width:60px; cursor:pointer;">股票</th>
            <th onclick="sortTable(1, 'placementsTable')" style="width:8%; min-width:80px; cursor:pointer;">日期</th>
            <th style="width:25%; min-width:200px;">公告标题</th>
            <th onclick="sortTable(3, 'placementsTable')" style="width:8%; min-width:70px; cursor:pointer;">配售价</th>
            <th onclick="sortTable(4, 'placementsTable')" style="width:8%; min-width:70px; cursor:pointer;">现价</th>
            <th onclick="sortTable(5, 'placementsTable')" style="width:8%; min-width:70px; cursor:pointer;">涨跌幅</th>
            <th style="width:5%; min-width:50px;">PDF</th>
          </tr>
        </thead>
        <tbody>
          {{ table_rows }}
        </tbody>
      </table>
    </div>

    <div
      style="margin-top: 1rem; padding: 10px 14px; background: #fbfbfb; border-radius: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;">
      <div style="flex:1; min-width:200px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          涨幅排名 (配售后表现)</div>
        <div style="display:flex; flex-direction:column; gap:4px;">
          {{ ranking_html }}
        </div>
      </div>
      <div style="flex:1; min-width:160px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          重要提示</div>
        <div style="font-size:11px; color:#999; line-height:1.6;">仅显示经关键词筛选的配售/融资公告。配售价从公告PDF中自动提取，可能存在误差。数据仅供参考，不构成投资建议。
        </div>
      </div>
    </div>
  </div>
</body>

</html>
