<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ASX Unified Performance Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8fafc; color: #1e293b; }
        
        .dashboard-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; border-bottom: 2px solid #e2e8f0; padding-bottom: 16px; }
        .dashboard-title { font-size: 28px; font-weight: 700; color: #0f172a; }
        .dashboard-timestamp { font-size: 13px; color: #64748b; }

        /* Main Tabs Table */
        .main-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .main-tab-btn { padding: 12px 24px; border: none; background: #fff; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 15px; font-weight: 600; color: #64748b; border: 1px solid #e2e8f0; border-bottom: none; transition: all 0.2s; }
        .main-tab-btn:hover { background: #f1f5f9; color: #0f172a; }
        .main-tab-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        
        .tab-content-wrap { background: #fff; border-radius: 0 8px 8px 8px; border: 1px solid #e2e8f0; padding: 0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); overflow: hidden; min-height: 600px; }
        .tab-content { display: none; padding: 0; }
        .tab-content.active { display: block; }

        /* Consolidating Module Styles */
        {{ master_styles }}
        
        /* Overrides to adapt the fragments */
        .module-wrap .wrap { padding: 20px; }
        .module-wrap h1 { display: none; } /* Hide module headers as we have dashboard header */
        
        /* Ensure the nested tabs in Analyzer work */
        .module-wrap #Stocks, .module-wrap #ETFs { display: block; } /* Show by default if script doesn't trigger on load */
    </style>
    <script>
        function selectMainTab(evt, tabId) {
            var i, contents, btns;
            contents = document.getElementsByClassName("tab-content");
            for (i = 0; i < contents.length; i++) {
                contents[i].style.display = "none";
            }
            btns = document.getElementsByClassName("main-tab-btn");
            for (i = 0; i < btns.length; i++) {
                btns[i].className = btns[i].className.replace(" active", "");
            }
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.className += " active";
            
            // Re-trigger defaults for the module (e.g. nested tabs)
            if (tabId === 'tab-analyzer') {
                const defOpen = document.querySelector('#module-analyzer button[id="defaultOpen"]');
                if (defOpen) defOpen.click();
            }
        }
        
        // Include module scripts
        {{ master_scripts }}
        
        // Wrap everything in an onload
        window.onload = function() {
            // Click the default main tab
            document.querySelector('.main-tab-btn').click();
        };
    </script>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <div>
                <h1 class="dashboard-title">ASX Unified DASHBOARD</h1>
                <p style="font-size: 14px; color: #64748b;">Comprehensive ASX market and sentiment analysis</p>
            </div>
            <div class="dashboard-timestamp">Last Updated: {{ timestamp }}</div>
        </div>

        <div class="main-tabs">
            <button class="main-tab-btn" onclick="selectMainTab(event, 'tab-analyzer')">📊 Trend Analyzer</button>
            <button class="main-tab-btn" onclick="selectMainTab(event, 'tab-catalysts')">🚀 Catalyst Radar</button>
            <button class="main-tab-btn" onclick="selectMainTab(event, 'tab-announcements')">📢 Recent Announcements</button>
            <button class="main-tab-btn" onclick="selectMainTab(event, 'tab-placements')">💰 Capital Placements</button>
        </div>

        <div class="tab-content-wrap">
            <div id="tab-analyzer" class="tab-content">
                {{ analyzer_content }}
            </div>
            <div id="tab-catalysts" class="tab-content">
                {{ catalysts_content }}
            </div>
            <div id="tab-announcements" class="tab-content">
                {{ announcements_content }}
            </div>
            <div id="tab-placements" class="tab-content">
                {{ placements_content }}
            </div>
        </div>
    </div>
</body>
</html>
