<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans, "Helvetica Neue", Helvetica, Arial, sans-serif);
      font-size: 13px;
    }

    .wrap {
      padding: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    .legend-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #666;
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .radar-table {
      width: 100%;
      border-collapse: collapse;
    }

    .radar-table th {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      background-color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px;
      border-bottom: 1px solid #cbd5e1;
      text-align: left;
      white-space: nowrap;
    }

    .radar-table td {
      padding: 5px 8px;
      border-bottom: 0.5px solid #ddd;
      vertical-align: top;
    }

    .radar-table tr:last-child td {
      border-bottom: none;
    }

    .radar-table tr:nth-child(even) td {
      background-color: #f8f9fa;
    }

    .radar-table tr:hover td {
      background-color: #f1f3f5;
    }

    .ticker {
      font-weight: 500;
      font-size: 13px;
      color: #333;
    }

    .sector-tag {
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-top: 4px;
      display: block;
      white-space: normal;
      line-height: 1.2;
      word-break: break-word;
    }

    .s-gold {
      background: #FAEEDA;
      color: #633806;
    }

    .s-uranium {
      background: #E1F5EE;
      color: #085041;
    }

    .s-copper {
      background: #FAECE7;
      color: #712B13;
    }

    .s-pharma {
      background: #E6F1FB;
      color: #0C447C;
    }

    .s-energy {
      background: #EEEDFE;
      color: #3C3489;
    }

    .s-critical {
      background: #FBEAF0;
      color: #72243E;
    }

    .s-pgm {
      background: #EEEDFE;
      color: #3C3489;
    }

    .event-pill {
      display: block;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      white-space: normal;
      line-height: 1.3;
      word-break: break-word;
    }

    .e-result {
      background: #E6F1FB;
      color: #0C447C;
    }

    .e-drill {
      background: #E1F5EE;
      color: #085041;
    }

    .e-milestone {
      background: #FAEEDA;
      color: #633806;
    }

    .e-production {
      background: #EAF3DE;
      color: #27500A;
    }

    .e-cr {
      background: #FBEAF0;
      color: #72243E;
    }

    .e-risk {
      background: #FCEBEB;
      color: #791F1F;
    }

    .e-corporate {
      background: #EEEDFE;
      color: #3C3489;
    }

    .e-hot {
      background: #FCEBEB;
      color: #791F1F;
    }

    .month-bar {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .mb {
      height: 12px;
      flex: 1;
      border-radius: 2px;
      background: #eee;
      cursor: pointer;
    }

    .mb-active {
      background: #F57C00;
    }

    .mb-hot {
      background: #B71C1C;
    }

    .mb-watch {
      background: #FFD54F;
    }

    .prob {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .prob-bar-wrap {
      width: 100%;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      max-width: 80px;
    }

    .prob-bar {
      height: 6px;
      border-radius: 3px;
    }

    .prob-val {
      font-size: 11px;
      font-weight: 500;
      min-width: 60px;
      line-height: 1.4;
    }

    .p-vhigh {
      color: #0C447C;
    }

    .p-high {
      color: #0F6E56;
    }

    .p-med {
      color: #854F0B;
    }

    .p-low {
      color: #A32D2D;
    }

    .note-text {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      min-width: 120px;
      white-space: normal;
      word-break: break-word;
    }

    .warn-tag {
      font-size: 10px;
      color: #A32D2D;
      display: block;
      margin-top: 2px;
    }

    .cr-val {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .cr-desc {
      font-size: 10px;
      color: #666;
      line-height: 1.3;
      margin-top: 4px;
      white-space: normal;
      word-break: break-word;
    }
    
    .cr-high { background: #FCEBEB; color: #791F1F; }
    .cr-med { background: #FAEEDA; color: #633806; }
    .cr-low { background: #f1f5f9; color: #475569; }

    .tbl-wrap {
      border: 0.5px solid #ddd;
      border-radius: 8px;
      overflow-x: auto;
    }

    /* Timeline distinct styling in cell */
    .tl-item {
      margin-bottom: 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 10px;
      color: #555;
      line-height: 1.3;
    }

    .tl-time {
      font-size: 9px;
      font-weight: 500;
      color: #444;
      background: #e0e0e0;
      border-radius: 3px;
      padding: 1px 4px;
      display: inline-block;
      width: max-content;
    }

    .tl-future {
      background: #EF9F27;
      color: #412402;
    }

    .tl-soon {
      background: #1D9E75;
      color: #04342C;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 16px; color: #1e293b;">ASX Catalyst Radar <span style="font-size: 16px; font-weight: 400; color: #64748b;">(6-Month Outlook)</span></h1>

    <div class="legend-row">
      <div class="leg">
        <div class="leg-dot" style="background:#B71C1C;"></div>高热度 (Hot)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#F57C00;"></div>活跃期 (Active)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#FFD54F;"></div>观察期 (Watch)
      </div>
      <span style="margin-left:auto; font-size:11px; color:#999;">覆盖期：2026年4月 — 2026年9月</span>
    </div>

    <div class="tbl-wrap">
      <table class="radar-table">
        <thead>
          <tr>
            <th style="width:6%; min-width:60px;">股票</th>
            <th style="width:15%; min-width:120px;">项目进展时间线</th>
            <th style="width:16%; min-width:140px;">关键催化剂事件</th>
            <th style="width:14%; min-width:130px;">核心风险事件</th>
            <th style="width:8%; min-width:80px;">财报窗口</th>
            <th style="width:10%; min-width:110px;">时间热力图<br><span
                style="font-weight:400;text-transform:none;letter-spacing:0;font-size:9px;">Apr - Sep</span></th>
            <th style="width:8%; min-width:80px;">CR 可能性</th>
            <th style="width:9%; min-width:90px;">爆发概率</th>
            <th style="width:14%; min-width:150px;">核心观察点</th>
          </tr>
        </thead>
        <tbody>
          {{ table_rows }}
        </tbody>
      </table>
    </div>

    <div
      style="margin-top: 1rem; padding: 10px 14px; background: #fbfbfb; border-radius: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;">
      <div style="flex:1; min-width:200px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          爆发窗口排序</div>
        <div style="display:flex; flex-direction:column; gap:4px;">
          {{ breakout_html }}
        </div>
      </div>
      <div style="flex:1; min-width:160px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          重要提示</div>
        <div style="font-size:11px; color:#999; line-height:1.6;">所有时间节点基于公司公告及市场信息，仅供参考，不构成投资建议。（此文档完全基于 json 数据动态生成）
        </div>
      </div>
    </div>
  </div>
</body>

</html>
