<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans, "Helvetica Neue", Helvetica, Arial, sans-serif);
      font-size: 13px;
    }

    .wrap {
      padding: 10px;
      max-width: 100%;
      margin: 0 auto;
    }

    .legend-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      align-items: center;
    }

    .leg {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #666;
    }

    .leg-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .radar-table {
      width: 100%;
      border-collapse: collapse;
    }

    .radar-table th {
      font-size: 11px;
      font-weight: 600;
      color: #334155;
      background-color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px;
      border-bottom: 1px solid #cbd5e1;
      text-align: left;
      white-space: nowrap;
    }

    .radar-table td {
      padding: 5px 8px;
      border-bottom: 0.5px solid #ddd;
      vertical-align: top;
    }

    .radar-table tr:last-child td {
      border-bottom: none;
    }

    .radar-table tr:nth-child(even) td {
      background-color: #f8f9fa;
    }

    .radar-table tr:hover td {
      background-color: #f1f3f5;
    }

    .ticker {
      font-weight: 500;
      font-size: 13px;
      color: #333;
    }

    .company-name {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
      line-height: 1.2;
      word-break: break-word;
    }

    .event-pill {
      display: block;
      font-size: 10px;
      padding: 3px 6px;
      border-radius: 4px;
      margin-bottom: 4px;
      white-space: normal;
      line-height: 1.3;
      word-break: break-word;
    }

    .e-result {
      background: #E6F1FB;
      color: #0C447C;
    }

    .e-drill {
      background: #E1F5EE;
      color: #085041;
    }

    .e-milestone {
      background: #FAEEDA;
      color: #633806;
    }

    .e-production {
      background: #EAF3DE;
      color: #27500A;
    }

    .e-cr {
      background: #FBEAF0;
      color: #72243E;
    }

    .e-risk {
      background: #FCEBEB;
      color: #791F1F;
    }

    .e-corporate {
      background: #EEEDFE;
      color: #3C3489;
    }

    .e-hot {
      background: #FCEBEB;
      color: #791F1F;
    }

    .note-text {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      min-width: 120px;
      white-space: normal;
      word-break: break-word;
    }

    .tbl-wrap {
      border: 0.5px solid #ddd;
      border-radius: 8px;
      overflow-x: auto;
    }

    .date-tag {
      font-size: 10px;
      font-weight: 500;
      color: #444;
      background: #e0e0e0;
      border-radius: 3px;
      padding: 1px 6px;
      display: inline-block;
      white-space: nowrap;
    }

    .date-recent {
      background: #EF9F27;
      color: #412402;
    }

    .date-today {
      background: #1D9E75;
      color: #04342C;
    }

    .pdf-link {
      display: inline-block;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: #E6F1FB;
      color: #0C447C;
      text-decoration: none;
      white-space: nowrap;
    }

    .pdf-link:hover {
      background: #c8def5;
    }

    .summary-text {
      font-size: 11px;
      color: #555;
      line-height: 1.5;
      white-space: normal;
      word-break: break-word;
      max-width: 400px;
    }

    .stats-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
      align-items: center;
    }

    .stat-badge {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <h1 style="font-size: 24px; font-weight: 600; margin-bottom: 16px; color: #1e293b;">ASX Price Sensitive Announcements <span style="font-size: 16px; font-weight: 400; color: #64748b;">Scanner</span></h1>

    <div class="legend-row">
      <div class="leg">
        <div class="leg-dot" style="background:#1D9E75;"></div>今日 (Today)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#EF9F27;"></div>近7日 (Recent)
      </div>
      <div class="leg">
        <div class="leg-dot" style="background:#e0e0e0;"></div>更早 (Older)
      </div>
      <span style="margin-left:auto; font-size:11px; color:#999;">{{ stats_text }}</span>
    </div>

    <div class="tbl-wrap">
      <table class="radar-table">
        <thead>
          <tr>
            <th style="width:6%; min-width:60px;">股票</th>
            <th style="width:8%; min-width:80px;">日期</th>
            <th style="width:25%; min-width:200px;">公告标题</th>
            <th style="width:40%; min-width:300px;">摘要</th>
            <th style="width:6%; min-width:50px;">PDF</th>
          </tr>
        </thead>
        <tbody>
          {{ table_rows }}
        </tbody>
      </table>
    </div>

    <div
      style="margin-top: 1rem; padding: 10px 14px; background: #fbfbfb; border-radius: 8px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start;">
      <div style="flex:1; min-width:200px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          活跃股票排名 (按公告频次)</div>
        <div style="display:flex; flex-direction:column; gap:4px;">
          {{ ranking_html }}
        </div>
      </div>
      <div style="flex:1; min-width:160px;">
        <div
          style="font-size:11px; font-weight:500; color:#666; margin-bottom:6px; text-transform: uppercase; letter-spacing:0.04em;">
          重要提示</div>
        <div style="font-size:11px; color:#999; line-height:1.6;">仅显示经正面关键词筛选的价格敏感公告。数据来源于 ASX API，仅供参考，不构成投资建议。
        </div>
      </div>
    </div>
  </div>
</body>

</html>
